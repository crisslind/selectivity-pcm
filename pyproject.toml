[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "selectivity-pcm"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "rdkit",
    "requests",
    "tqdm",
    "matplotlib",
    "typer",
    "biopython",
]

[project.optional-dependencies]
klifs = [
    "opencadd",
]

dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff.lint]
ignore = ["B008"]